name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize

          if ($results) {
            Write-Host ""
            Write-Host "::error::PSScriptAnalyzer found $($results.Count) issue(s)"
            foreach ($result in $results) {
              Write-Host "::error file=$($result.ScriptPath),line=$($result.Line)::[$($result.Severity)] $($result.RuleName): $($result.Message)"
            }
            exit 1
          }

          Write-Host "PSScriptAnalyzer: No issues found"

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1

      - name: Set up .NET for offline CLI contracts
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare exact CLI and synthetic extraction fixture
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'ppds-contract-cli'
          dotnet tool install PPDS.Cli --version 1.4.1 --tool-path $toolPath --configfile ./tests/fixtures/NuGet.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = Get-ChildItem $toolPath -Filter ppds.dll -Recurse -Force |
            Where-Object { $_.FullName -match '[/\\]net8.0[/\\]any[/\\]ppds.dll$' } |
            Select-Object -First 1
          if (-not $cli) { throw 'Packaged net8.0 CLI not found' }
          dotnet build ./tests/fixtures/ContractPlugin/ContractPlugin.csproj --configuration Release "-p:PpdsCliDirectory=$($cli.DirectoryName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PPDS_TEST_CLI_PATH=$($cli.FullName)" >> $env:GITHUB_ENV
          "PPDS_TEST_PLUGIN_PATH=$((Resolve-Path ./tests/fixtures/ContractPlugin/bin/Release/net462/ContractPlugin.dll).Path)" >> $env:GITHUB_ENV

      - name: Run Tests with Coverage
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './TestResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @((Get-ChildItem ./src/PPDS.Tools -Filter *.ps1 -Recurse).FullName)
          $config.CodeCoverage.OutputPath = './coverage.xml'
          $config.CodeCoverage.OutputFormat = 'JaCoCo'

          $result = Invoke-Pester -Configuration $config
          if (-not $result) { throw 'Pester did not return a result' }

          # Display coverage summary
          Write-Host ""
          Write-Host "===== Code Coverage Summary ====="
          Write-Host "Commands Executed: $($result.CodeCoverage.CommandsExecutedCount)"
          Write-Host "Commands Missed: $($result.CodeCoverage.CommandsMissedCount)"
          Write-Host "Coverage: $([math]::Round($result.CodeCoverage.CoveragePercent, 2))%"
          Write-Host "================================="

          # Check coverage threshold
          $threshold = 80
          if ($result.CodeCoverage.CoveragePercent -lt $threshold) {
            Write-Host "::warning::Code coverage ($([math]::Round($result.CodeCoverage.CoveragePercent, 2))%) is below $threshold% threshold"
          }

          # Fail if tests failed
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0) {
            exit 1
          }

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: TestResults.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  validate-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path './src/PPDS.Tools/PPDS.Tools.psd1'
          Write-Host "Module: $($manifest.Name)"
          Write-Host "Version: $($manifest.Version)"
          Write-Host "Functions: $($manifest.ExportedFunctions.Keys -join ', ')"

      - name: Import Module
        shell: pwsh
        run: |
          Import-Module './src/PPDS.Tools' -Force -ErrorAction Stop
          Get-Command -Module PPDS.Tools
