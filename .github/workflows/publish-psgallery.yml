name: Publish to PowerShell Gallery

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Validate Module Manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path './src/PPDS.Tools/PPDS.Tools.psd1'
          $pre = $manifest.PrivateData.PSData.Prerelease
          $fullVersion = if ($pre) { "$($manifest.Version)-$pre" } else { $manifest.Version }
          Write-Host "Publishing module: $($manifest.Name) v$fullVersion"

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Error "PSGALLERY_API_KEY secret is not set"
            exit 1
          }

          Publish-Module `
            -Path './src/PPDS.Tools' `
            -NuGetApiKey $env:PSGALLERY_API_KEY `
            -Verbose
